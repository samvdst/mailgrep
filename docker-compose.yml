services:
  mailgrep:
    image: ghcr.io/samvdst/mailgrep:latest
    # building from a source checkout instead: uncomment the next line
    # build: .
    container_name: mailgrep
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      # 64 hex chars; encrypts IMAP credentials at rest. Generate with:
      #   openssl rand -hex 32
      MAILGREP_KEY: "${MAILGREP_KEY:?set MAILGREP_KEY in .env}"
      # login password; leave unset to run without a login
      MAILGREP_PASSWORD: "${MAILGREP_PASSWORD:-}"
    volumes:
      - mailgrep-data:/data

volumes:
  mailgrep-data:
