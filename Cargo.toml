[package]
name = "mailgrep"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.1.4"
anyhow = "1.0.104"
axum = "0.8.9"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
hex = "0.4.3"
imap = "2"
imap-proto = "0.10"
libsql = { version = "0.9.30", default-features = false, features = ["core"] }
mail-parser = "0.11.5"
native-tls = "0.2.18"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tantivy = "0.26.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
